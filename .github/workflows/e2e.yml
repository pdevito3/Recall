name: e2e

# GitHub does not expand the matrix of a job that its if skips. So a skipped matrix job in ci.yml showed its raw name
# template, e2e (${{ matrix.provider }}), as its check name. The caller job has no matrix, so a skipped run shows as e2e.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - idp: keycloak
            provider: Keycloak
          - idp: fusionauth
            provider: FusionAuth
          - idp: authentik
            provider: Authentik
          - idp: cognito
            provider: Cognito
          - idp: zerofactor
            provider: ZeroFactor
          # A public service, so its failure does not fail the workflow
          - idp: duendedemo
            provider: DuendeDemo
            public: true
    continue-on-error: ${{ matrix.public == true }}
    name: ${{ matrix.provider }}
    env:
      AuthProvider: ${{ matrix.provider }}
      IDP: ${{ matrix.idp }}
      # The DCP log shows the container runtime that DCP uses and each container command that it runs
      DCP_DIAGNOSTICS_LOG_FOLDER: ${{ github.workspace }}/stack-logs/dcp
      DCP_DIAGNOSTICS_LOG_LEVEL: debug
      # The runner has Docker and Podman. With no setting, Aspire probes both and can pick Podman when the Docker probe
      # is slow. Under Podman, a provider container that gets a container endpoint of the stack never starts.
      ASPIRE_CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.4xx # One SDK band. A new band can add style errors, so move to it in its own PR.

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Restore the .NET tools
        run: dotnet tool restore

      - name: Create the development certificate
        run: dotnet dev-certs https

      - name: Install the frontend packages
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-chromium

      - name: Start the stack
        run: |
          echo "STACK_START=$(date -u +%s)" >> "$GITHUB_ENV"
          dotnet aspire start --isolated --non-interactive --apphost Recall.AppHost

      - name: Wait for healthy resources
        run: |
          if [ "$IDP" != duendedemo ]; then
            dotnet aspire wait "$IDP" --status up --timeout 300 --non-interactive --apphost Recall.AppHost
          fi
          for resource in server webfrontend; do
            dotnet aspire wait "$resource" --status healthy --timeout 900 --non-interactive --apphost Recall.AppHost
          done

      - name: Run the e2e tests
        working-directory: frontend
        run: pnpm test:e2e:stack

      - name: Save the stack logs
        if: always()
        run: |
          mkdir -p stack-logs
          dotnet aspire logs --timestamps --non-interactive --apphost Recall.AppHost > stack-logs/aspire.log 2>&1 || true
          # The logs of the Aspire CLI and the AppHost process
          cp -r ~/.aspire/logs stack-logs/aspire-cli || true
          # The state of each resource, and the containers of both runtimes on the runner
          dotnet aspire describe --non-interactive --apphost Recall.AppHost > stack-logs/resources.txt 2>&1 || true
          docker ps -a > stack-logs/docker-ps.txt 2>&1 || true
          podman ps -a > stack-logs/podman-ps.txt 2>&1 || true
          docker events --since "$STACK_START" --until "$(date -u +%s)" > stack-logs/docker-events.txt 2>&1 || true

      - name: Stop the stack
        if: always()
        run: dotnet aspire stop --non-interactive --apphost Recall.AppHost || true

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-${{ matrix.idp }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            stack-logs/
          retention-days: 30
          if-no-files-found: ignore
