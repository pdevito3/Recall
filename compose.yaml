name: recall

services:
  recall:
    image: ghcr.io/pdevito3/recall:${RECALL_TAG:-latest}
    # Compose builds from this checkout when it cannot pull the image.
    build: .
    restart: unless-stopped
    # The server stops in 8 s and then flushes its telemetry files. See HostShutdownTimeout in JobHosting.cs.
    stop_grace_period: 10s
    user: ${PUID:-1654}:${PGID:-1654}
    ports:
      - ${RECALL_PORT:-8080}:8080
    # A name with no value passes the value from .env, and passes nothing when .env has no such name.
    environment:
      - Auth__Providers__0__Id
      - Auth__Providers__0__DisplayName
      - Auth__Providers__0__Issuer
      - Auth__Providers__0__ClientId
      - Auth__Providers__0__ClientSecret
      - Auth__Providers__0__AllowHttp
      - Auth__OpenSignup
      - AllowedHosts
      - Transcription__Threads
    volumes:
      - ${RECALL_DATA:-recall-data}:/data
    healthcheck:
      interval: ${RECALL_PROBE_INTERVAL:-1h}

volumes:
  recall-data:
